[project]
name = "raven-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26,<5",
    "openai>=2.26,<4",
    "openai-agents>=0.22.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.6.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
    "websockets>=15,<17",
]

[project.scripts]
raven-harness = "raven_harness.__main__:main"
raven-prepare-rules = "raven_harness.rulebook:main"
raven-evaluate = "raven_harness.evaluation:main"
raven-evaluate-houses = "raven_harness.house_evaluation:main"
raven-protocol-smoke = "raven_harness.protocol_smoke:main"
raven-verify-evaluation = "raven_harness.evaluation_verifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
